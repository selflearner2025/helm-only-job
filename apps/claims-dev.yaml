# apps/claims-dev.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: claims-dev-new
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # child apps sync after parent
spec:
  project: default

  source:
    repoURL: https://github.com/selflearner2025/helm-only-job.git
    targetRevision: test
    path: overlays/dev      # ← points to dev overlay

  destination:
    server: https://kubernetes.default.svc
    namespace: single-bpmn-ns-new                   # ← shared namespace

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true