# apps/claims-dev.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: claims-qa-new
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # child apps sync after parent
spec:
  project: default

  source:
    repoURL: https://github.com/selflearner2025/helm-only-job.git
    targetRevision: test
    path: overlays/qa      # ← points to qa overlay

  destination:
    server: https://kubernetes.default.svc
    namespace: single-bpmn-ns-new                   # ← shared namespace

  syncPolicy: 
    automated: {}
      #prune: true
      #selfHeal: true
    syncOptions:
     # - CreateNamespace=true
      - ServerSideApply=false
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - Validate=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true