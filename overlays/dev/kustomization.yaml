# kustomize/overlays/dev/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: single-bpmn-ns-new                   # ← single shared namespace, same for all envs

helmCharts:

  - name: job-chart-new
    repo: http://nexus-nexus-repository-manager.default.svc.cluster.local:8081/repository/helm-hosted/
    version: 0.0.1
    releaseName: claims-job-dev              # ← releaseName scoped per env
    valuesFile: values-dev-job.yaml